-buy`,stage:`choose`,title:`Проверьте, что выгоднее: купить или снимать`,text:`Сравните два пути при одинаковом бюджете: купить жильё в ипотеку или снимать и вкладывать разницу вместе с накопленным взносом. Результат сильно зависит от срока, ставки и роста цен.`,tips:[`Попробуйте несколько значений роста цены жилья: это главная неопределённость.`,`Учтите то, что в цифры не входит: стабильность, свобода ремонта, возможность переехать.`],weeks:[1,1],calc:{scenarioId:`buy-vs-rent`,label:`Сравнить покупку и аренду`},paths:[`flat`,`ready`,`house`]},{id:`budget`,stage:`choose`,title:`Посчитайте бюджет и платёж`,text:`Прикиньте, какой платёж вы выдержите, и проверьте запас прочности на случай падения дохода.`,tips:[`Платежи по всем кредитам лучше держать в пределах 30–40 % дохода: выше 50 % это зона высокого риска, и банк может отказать.`,`Учтите расходы на оформление, страховку и переезд.`],weeks:[1,2],calc:{scenarioId:`program-compare`,label:`Сравнить программы и посчитать платёж`},variants:{build:{text:`Во время стройки платятся только проценты, а после сдачи дома — полный платёж. Проверьте бюджет на обоих этапах.`,calc:{scenarioId:`house-build`,label:`Посчитать стройку и платежи`}},repair:{text:`Сравните, что выгоднее: брать кредит на ремонт или накопить самим, и какую нагрузку выдержит бюджет.`,calc:{scenarioId:`renovation-loan`,label:`Посчитать кредит на ремонт`}},land:{text:`Определите, какую сумму на землю вы готовы вложить и какой платёж выдержите. Для участка условия кредита часто отличаются от ипотеки на жильё.`},rural:{text:`Сравните платёж по льготной программе с обычной ипотекой и проверьте, укладывается ли сумма в лимит программы.`,calc:{scenarioId:`program-compare`,preset:`typical`,label:`Сравнить льготную и обычную ипотеку`}}}},{id:`save-down`,stage:`money`,title:`Накопите первоначальный взнос`,text:`Определите минимальный взнос по выбранной программе и составьте план накоплений.`,tips:[`Чем больше взнос, тем меньше переплата и платёж.`,`Часть взноса можно закрыть материнским капиталом, если он положен.`],weeks:[8,52],when:`hasDown == 0`,paths:[`flat`,`ready`,`house`,`land`,`build`,`rural`],warn:`Не берите взнос в долг без учёта платежа по этому долгу: банк учтёт его при оценке вашей нагрузки.`},{id:`mat-capital`,stage:`money`,title:`Подготовьте материнский капитал`,text:`Закажите выписку о размере средств и выясните в банке, как их можно направить: на первоначальный взнос или на погашение части ипотеки.`,tips:[`Деньги перечисляет Социальный фонд России после рассмотрения заявления, на это нужно до нескольких недель: заложите время в сроки сделки.`,`Жильё, купленное с материнским капиталом, нужно оформить в общую собственность родителей и детей: обязательство о выделении долей уточните у банка и нотариуса.`,`Налоговый вычет не распространяется на сумму, оплаченную материнским капиталом.`,`Для квартиры по договору долевого участия узнайте у банка и застройщика, как маткапитал учитывается при расчётах через эскроу-счёт.`],docs:[`Сертификат или выписка о размере средств материнского капитала`,`Паспорта родителей и свидетельства о рождении детей`],weeks:[2,6],when:`matCapital == 1`,paths:[`flat`,`ready`,`house`,`build`,`rural`],warn:`Деньги маткапитала поступают не сразу после заявления: учитывайте это в сроках сделки и в договоре.`},{id:`rural-check`,stage:`money`,title:`Проверьте участие в сельской ипотеке`,text:`Узнайте, входит ли территория в перечень программы, подходите ли вы как заёмщик и какие лимиты суммы и ставка действуют сейчас.`,tips:[`Условия программы меняются: проверяйте их на сайте банка и у менеджера.`,`Уточните требования к объекту и к срокам регистрации.`],docs:[`Паспорт`,`Документы о занятости и доходах (по требованиям программы)`],weeks:[1,2],paths:[`rural`],warn:`Не вносите аванс продавцу или подрядчику, пока банк не подтвердил участие в программе.`},{id:`program`,stage:`money`,title:`Выберите программу и банк`,text:`Сравните ставки, взнос, срок и дополнительные условия: страхование, комиссии, возможность досрочного погашения.`,tips:[`Сравнивайте полную стоимость кредита, а не только ставку.`,`Узнайте, как банк относится к досрочному погашению.`],weeks:[1,2],calc:{scenarioId:`program-compare`,label:`Сравнить льготную и обычную ипотеку`},paths:[`flat`,`ready`,`house`,`land`,`build`,`rural`],variants:{land:{title:`Выберите вид финансирования участка`,text:`Ипотека на землю и условия для неё зависят от банка и назначения участка. Уточните, можно ли купить участок с последующим строительством в рамках одной программы.`},build:{title:`Выберите программу для строительства`,text:`Нужна программа, по которой деньги выдаются по этапам. Узнайте, как банк контролирует стройку и какие документы нужны для каждого транша.`,calc:{scenarioId:`house-build`,label:`Посчитать строительство`}},rural:{title:`Выберите банк и условия программы`,text:`Сравните ставку по программе с рыночной и убедитесь, что сумма кредита укладывается в лимит.`,calc:{scenarioId:`program-compare`,preset:`over`,label:`Проверить лимит программы`}}}},{id:`preapprove`,stage:`money`,title:`Получите предварительное одобрение`,text:`Подайте заявку и узнайте, какую сумму и на каких условиях вам готовы дать. С одобрением проще искать объект и торговаться.`,tips:[`Одобрение действует ограниченное время: ищите объект сразу после получения.`,`Проверьте кредитную историю заранее и закройте мелкие долги.`],docs:[`Паспорт`,`Подтверждение дохода и занятости`,`Данные о действующих кредитах`],weeks:[1,2],calc:{scenarioId:`stress-test`,label:`Проверить запас прочности бюджета`},paths:[`flat`,`ready`,`house`,`land`,`build`,`rural`]},{id:`repair-financing`,stage:`money`,title:`Решите, чем оплатить ремонт`,text:`Свои деньги, накопления или кредит на ремонт. Сравните стоимость вариантов и выберите тот, что не перегрузит бюджет.`,tips:[`Сравните кредит с накоплением: иногда подождать выгоднее.`,`Заложите запас 10–15 % на непредвиденное.`],weeks:[1,3],calc:{scenarioId:`renovation-loan`,label:`Кредит или накопить самому`},paths:[`repair`],variants:{repair:{title:`Выберите способ оплаты ремонта`}}},{id:`search-flat`,stage:`object`,title:`Выберите застройщика и квартиру`,text:`Проверьте застройщика: разрешение на строительство, проектную декларацию, сроки сдачи предыдущих домов и аккредитацию в банке.`,tips:[`Убедитесь, что расчёты идут через эскроу-счёт.`,`Посмотрите дом и стройплощадку лично, а не только рендеры.`],docs:[`Проектная декларация`,`Разрешение на строительство`,`Выписка из ЕГРН на земельный участок застройщика`],weeks:[3,8],paths:[`flat`]},{id:`search-ready`,stage:`object`,title:`Подберите объект`,text:`Осмотрите несколько вариантов, сравните состояние и цену, узнайте, почему продавец продаёт и сколько в объекте собственников.`,tips:[`Не принимайте решение на первом показе.`,`Проверьте шум, соседей, транспорт и инфраструктуру в разное время суток.`],weeks:[3,10],paths:[`ready`]},{id:`search-house`,stage:`object`,title:`Подберите дом с участком`,text:`Оцените состояние дома, фундамента, кровли, коммуникаций и подъезда. Узнайте, как дом отапливается и сколько это стоит.`,tips:[`Пригласите знакомого строителя или независимого эксперта.`,`Осмотрите дом после дождя и в холодное время года, если возможно.`],weeks:[4,12],paths:[`house`,`rural`],when:`is_house || ruralKind == 0`,variants:{rural:{title:`Подберите жильё на сельской территории`,text:`Объект должен находиться на территории, входящей в программу, и соответствовать требованиям банка. Проверьте это до задатка.`}}},{id:`search-land`,stage:`object`,title:`Подберите участок`,text:`Определите район, размер и назначение. Узнайте у собственника, как участок получен и есть ли у него обременения.`,tips:[`Посмотрите участок лично, пройдите по границам.`,`Узнайте у соседей про подъезд зимой, воду и свет.`],weeks:[3,10],paths:[`land`,`build`],when:`is_land || hasLand == 0`,variants:{build:{title:`Купите участок под строительство`,text:`Выбирайте участок, на котором можно строить жилой дом, и проверьте это до покупки.`}}},{id:`check-docs-ready`,stage:`object`,title:`Проверьте документы на объект`,text:`Закажите свежую выписку из ЕГРН, проверьте основание права собственности, число собственников, обременения и тех, кто прописан в объекте.`,tips:[`Узнайте, не участвовали ли в сделке несовершеннолетние и материнский капитал.`,`Проверьте, нет ли незаконной перепланировки.`],docs:[`Выписка из ЕГРН (реестра недвижимости)`,`Договор, по которому продавец получил объект`,`Справка о зарегистрированных лицах`,`Согласие супруга продавца, если нужно`],weeks:[1,2],paths:[`ready`,`house`,`rural`],when:`!is_rural || ruralKind == 0`,warn:`Не вносите аванс, пока не проверили выписку из ЕГРН и банк не одобрил объект.`},{id:`check-land`,stage:`object`,title:`Проверьте земельный участок`,text:`Убедитесь в категории земель и виде разрешённого использования, границах, отсутствии обременений и возможности подключить коммуникации.`,tips:[`Для жилого дома нужен подходящий вид разрешённого использования.`,`Узнайте про охранные зоны, затопляемость и подъезд зимой.`],docs:[`Выписка из ЕГРН на участок`,`Кадастровый план или сведения о границах`,`Технические условия на подключение, если есть`],weeks:[1,3],paths:[`house`,`land`,`build`,`rural`],warn:`Если участок нельзя использовать под жильё, банк откажет, а строить дом будет нельзя.`},{id:`appraisal`,stage:`object`,title:`Закажите оценку объекта`,text:`Банк принимает жильё в залог по отчёту независимого оценщика. Оценку обычно оплачивает заёмщик, а от её результата зависит сумма кредита.`,tips:[`Заказывайте оценку у оценщика из списка банка: отчёт другого банк может не принять.`,`Если оценка ниже цены сделки, разницу придётся покрыть своими деньгами.`],docs:[`Отчёт об оценке`,`Документы на объект`],weeks:[1,2],paths:[`ready`,`house`,`land`,`rural`],when:`!is_rural || ruralKind == 0`},{id:`project`,stage:`object`,title:`Выберите проект и составьте смету`,text:`Подберите типовой или заказной проект, получите смету по этапам и график работ. Банк оценивает проект и смету до выдачи денег.`,tips:[`Сверяйте смету с нескольких подрядчиков.`,`Сразу разделите смету на этапы: по ним будут выдаваться деньги.`],docs:[`Проект дома`,`Смета по этапам`,`График работ`],weeks:[3,10],calc:{scenarioId:`house-build`,label:`Посчитать строительство`},paths:[`build`,`rural`],when:`is_build || ruralKind == 1`},{id:`permit`,stage:`object`,title:`Уведомите администрацию о строительстве`,text:`Для жилого дома на участке для индивидуального строительства обычно подаётся уведомление о планируемом строительстве в орган местного самоуправления.`,tips:[`Дождитесь ответа до начала работ.`,`Порядок зависит от вида участка и региона: уточните его в администрации.`],docs:[`Уведомление о планируемом строительстве`,`Правоустанавливающие документы на участок`,`Схема размещения дома`],weeks:[1,2],paths:[`build`,`rural`],when:`is_build || ruralKind == 1`,warn:`Порядок разрешения на строительство может отличаться: проверьте актуальные требования до начала работ.`},{id:`contractor`,stage:`object`,title:`Выберите подрядчика и подпишите договор`,text:`Проверьте опыт, отзывы и реальные объекты. В договоре зафиксируйте этапы, сроки, цену, гарантию и ответственность за задержку.`,tips:[`Платите по этапам и по актам, а не вперёд.`,`Попросите показать завершённые дома и поговорите с заказчиками.`],docs:[`Договор подряда`,`Смета и график по этапам`,`Документы подрядчика`],weeks:[2,6],paths:[`build`,`rural`],when:`(is_build && contractor == 1) || (is_rural && ruralKind == 1)`},{id:`self-build`,stage:`object`,title:`Организуйте стройку своими силами`,text:`Составьте график, закупите материалы по этапам, найдите бригады на каждый вид работ и фотографируйте результат для банка.`,tips:[`Закупайте материалы под этап, а не всё сразу.`,`Фиксируйте работы фото и актами: банку нужно подтверждение для траншей.`],weeks:[2,4],paths:[`build`],when:`contractor == 0`,warn:`Стройка своими силами требует времени и опыта: учтите риск удорожания и задержек.`},{id:`repair-scope`,stage:`object`,title:`Составьте смету ремонта`,text:`Распишите работы и материалы по комнатам и этапам, сравните цены и заложите резерв.`,tips:[`Сравните минимум три сметы.`,`Заложите 10–15 % на непредвиденное.`],weeks:[1,3],calc:{scenarioId:`renovation-loan`,label:`Посчитать платёж и бюджет`},paths:[`repair`]},{id:`permit-replan`,stage:`object`,title:`Согласуйте перепланировку`,text:`Изменение планировки требует согласования до начала работ. Подготовьте проект и согласие собственников.`,tips:[`Узнайте в вашем регионе, какой орган согласует перепланировку.`,`Изменения несущих конструкций часто невозможны.`],docs:[`Проект перепланировки`,`Выписка из ЕГРН`,`Согласие совладельцев`],weeks:[4,12],paths:[`repair`],when:`repairKind == 2`,warn:`Не начинайте работы до согласования: самовольная перепланировка может привести к штрафу и проблемам при продаже.`},{id:`repair-contractor`,stage:`object`,title:`Выберите исполнителя и заключите договор`,text:`Проверьте опыт и отзывы, зафиксируйте в договоре работы, сроки, цену, гарантию и порядок приёмки.`,tips:[`Предоплата — не больше стоимости первого этапа.`,`Требуйте акты по этапам.`],weeks:[2,4],paths:[`repair`]},{id:`ddu`,stage:`deal`,title:`Заключите договор долевого участия`,text:`Договор регистрируется в Росреестре, а деньги хранятся на эскроу-счёте и переходят застройщику после ввода дома в эксплуатацию.`,tips:[`Прочитайте сроки передачи и ответственность за задержку.`,`Проверьте, что в договоре указаны цена, площадь и характеристики квартиры.`],docs:[`Договор долевого участия`,`Заявление на открытие эскроу-счёта`],weeks:[1,3],paths:[`flat`],warn:`Деньги на эскроу-счёте защищены от банкротства застройщика, но срок сдачи дома всё равно может сдвинуться.`},{id:`sale-contract`,stage:`deal`,title:`Подпишите договор купли-продажи`,text:`Зафиксируйте цену, порядок расчётов, срок передачи объекта и снятие обременений. Расчёты безопаснее проводить через банк.`,tips:[`Не передавайте наличные без расписки и банковской ячейки или аккредитива.`,`Укажите срок, к которому продавец выпишется из объекта.`],docs:[`Договор купли-продажи`,`Документы продавца`,`Согласие банка на сделку`],weeks:[1,3],paths:[`ready`,`house`,`land`,`rural`],when:`!is_rural || ruralKind == 0`,variants:{land:{title:`Подпишите договор купли-продажи участка`,tips:[`Зафиксируйте в договоре кадастровый номер, категорию земель и вид разрешённого использования.`,`Не передавайте наличные без расписки и банковской ячейки или аккредитива.`]}}},{id:`credit-contract`,stage:`deal`,title:`Подпишите кредитный договор`,text:`Проверьте полную стоимость кредита, график платежей, условия досрочного погашения, штрафы и обязательное страхование.`,tips:[`Попросите график платежей до подписания.`,`Узнайте, как гасить досрочно и без комиссий ли это.`],docs:[`Кредитный договор`,`График платежей`,`Условия страхования`],weeks:[1,1],calc:{scenarioId:`early-repayment`,label:`Что будет, если гасить досрочно`},paths:[`flat`,`ready`,`house`,`land`,`build`,`rural`,`repair`],when:`!is_repair || ownFunds == 0`,variants:{repair:{title:`Оформите кредит на ремонт`,text:`Сравните условия, проверьте полную стоимость кредита и возможность досрочного погашения.`,weeks:[1,1]}}},{id:`insure`,stage:`deal`,title:`Оформите страхование`,text:`Страхование объекта, который остаётся в залоге у банка, обычно обязательно. Страхование жизни добровольно, но влияет на ставку у многих банков.`,tips:[`Сравните страховые компании: условия и цены отличаются.`,`Продлевать страховку нужно каждый год: поставьте напоминание.`],docs:[`Полис страхования объекта`,`Полис страхования жизни (по желанию)`],weeks:[1,1],paths:[`flat`,`ready`,`house`,`land`,`build`,`rural`],warn:`Если страховка истечёт, банк может изменить условия кредита: следите за датой продления.`},{id:`register`,stage:`deal`,title:`Зарегистрируйте право и ипотеку`,text:`Сделку регистрируют в Росреестре. Электронная регистрация обычно занимает несколько рабочих дней. Вы получаете выписку из ЕГРН.`,tips:[`Попросите подать документы электронно: так быстрее.`,`Проверьте выписку: ваши данные и запись об ипотеке должны быть верными.`],docs:[`Заявление о регистрации`,`Договор`,`Квитанция об оплате пошлины`],weeks:[1,2],paths:[`ready`,`house`,`land`,`rural`],when:`!is_rural || ruralKind == 0`},{id:`build-finance`,stage:`deal`,title:`Получайте деньги по этапам стройки`,text:`Банк выдаёт деньги траншами после выполнения этапов: нужны акты и осмотр. Пока стройка идёт, платятся только проценты на выданную часть.`,tips:[`Транш — часть кредита, которую банк выдаёт после выполненного этапа (фундамент, стены, крыша) по актам и после осмотра.`,`Эскроу — счёт, где банк хранит деньги до выполнения условий. Для дома, который вы строите сами, он обычно не нужен, но уточните у банка: у разных банков свои схемы.`,`Заранее узнайте, какие документы нужны для каждого транша.`,`Фотографируйте работы: это ускоряет выдачу следующего транша.`,`Кроме процентов, заложите оценку объекта, страхование залога и комиссии банка: у каждого банка свои условия.`],docs:[`Акты выполненных работ`,`Фото и отчёты об этапах`,`Заявки на транши`],weeks:[20,60],calc:{scenarioId:`house-build`,label:`Посмотреть платежи во время стройки`},paths:[`build`,`rural`],when:`is_build || ruralKind == 1`,warn:`Стройка почти всегда длится дольше плана: проверьте, хватит ли бюджета, если срок вырастет.`},{id:`finish-build`,stage:`deal`,title:`Завершите стройку и оформите дом`,text:`После окончания работ нужно уведомить администрацию, подготовить технический план и поставить дом на кадастровый учёт, чтобы зарегистрировать право собственности.`,tips:[`Закажите технический план у кадастрового инженера заранее.`,`Не забудьте закрыть акты с подрядчиком и забрать гарантию.`],docs:[`Уведомление об окончании строительства`,`Технический план`,`Акты приёмки`],weeks:[4,10],paths:[`build`,`rural`],when:`is_build || ruralKind == 1`},{id:`repair-work`,stage:`deal`,title:`Контролируйте работы и принимайте по актам`,text:`Проверяйте этапы на месте, фиксируйте замечания и платите после приёмки. Храните чеки и акты.`,tips:[`Принимайте работы по этапам, а не в конце.`,`Фото до, во время и после — ваша защита при спорах.`],weeks:[4,16],paths:[`repair`]},{id:`handover`,stage:`life`,title:`Примите квартиру по акту`,text:`Осмотрите квартиру до подписания акта приёма-передачи, зафиксируйте недостатки и потребуйте их устранения.`,tips:[`Возьмите с собой уровень, рулетку и знающего человека.`,`Недостатки вносите в акт, а не договаривайтесь устно.`],docs:[`Акт приёма-передачи`,`Перечень замечаний`],weeks:[2,4],paths:[`flat`]},{id:`keys`,stage:`life`,title:`Получите ключи и переоформите счета`,text:`Подпишите акт передачи, снимите показания счётчиков и переоформите лицевые счета на коммунальные услуги.`,docs:[`Акт передачи`,`Показания счётчиков`],weeks:[1,2],paths:[`ready`,`house`,`rural`],when:`!is_rural || ruralKind == 0`},{id:`utilities-land`,stage:`life`,title:`Решите вопрос с коммуникациями и подъездом`,text:`Подайте заявки на подключение электричества, воды и газа, если они доступны, и договоритесь о подъезде.`,tips:[`Технические условия имеют срок действия.`,`Подключение может занять месяцы и стоить заметных денег.`],weeks:[4,20],paths:[`land`]},{id:`plan-build`,stage:`life`,title:`Подготовьте строительство на участке`,text:`Если вы купили участок под дом, дальше вам подойдёт маршрут «Строительство дома»: проект, уведомление администрации, подряд и финансирование по этапам.`,tips:[`Заранее посчитайте платежи во время стройки: они отличаются от обычной ипотеки.`],weeks:[1,2],calc:{scenarioId:`house-build`,label:`Посчитать строительство дома`},paths:[`land`],when:`landPlan == 1`},{id:`furnish`,stage:`life`,title:`Обустройте жильё`,text:`Составьте план ремонта и покупок, начните с того, без чего нельзя жить, и оставьте остальное на потом.`,tips:[`Не берите кредит на мебель, пока не проверите бюджет.`,`Ремонт можно делать частями.`],weeks:[4,16],calc:{scenarioId:`renovation-loan`,label:`Посчитать кредит на ремонт`},paths:[`flat`,`ready`,`house`,`build`,`rural`]},{i oup:`Ваш кредит`},{key:`paid`,label:`Уже внесено платежей`,type:`number`,unit:`months`,default:36,min:0,maxExpr:`term * 12 - 1`,step:1,hint:`Сколько ежемесячных платежей вы уже сделали.`,group:`Ваш кредит`},{key:`lump`,label:`Сумма разового досрочного платежа`,type:`number`,unit:`money`,default:5e5,min:0,maxExpr:`amount`,step:1e4,hint:`Вносится сразу после последнего платежа. Если сумма больше остатка — кредит будет закрыт полностью.`,group:`Что вы планируете`},{key:`mode`,label:`После досрочного платежа`,type:`select`,unit:`none`,default:1,options:[{value:1,label:`Уменьшить срок (платёж прежний)`},{value:2,label:`Уменьшить платёж (срок прежний)`}],group:`Что вы планируете`},{key:`extra`,label:`Ежемесячная доплата к платежу`,type:`number`,unit:`money`,default:0,min:0,max:5e5,step:1e3,hint:`Регулярная доплата сверх обязательного платежа — тоже сокращает срок.`,visibleWhen:`mode == 1`,group:`Что вы планируете`},{key:`income`,label:`Доход семьи в месяц (на руки)`,type:`number`,unit:`money`,default:15e4,min:1e4,max:5e6,step:5e3,group:`Бюджет семьи`},{key:`expenses`,label:`Обязательные расходы в месяц`,type:`number`,unit:`money`,default:55e3,min:0,max:3e6,step:1e3,hint:`Еда, ЖКХ, транспорт, связь. Платёж по этому кредиту сюда не входит.`,group:`Бюджет семьи`}],formulas:[{key:`n`,label:`Срок кредита, мес.`,expr:`term * 12`},{key:`pay`,label:`Текущий ежемесячный платёж`,expr:`actualPay > 0 ? actualPay : pmt(rate, n, amount)`,note:`Аннуитетный платёж по исходным условиям кредита, округлён до копеек.`},{key:`bal`,label:`Остаток долга сейчас`,expr:`balance(rate, pay, amount, paid)`,note:`Остаток основного долга после уже внесённых платежей.`},{key:`left`,label:`Осталось платежей`,expr:`n - paid`},{key:`lumpEff`,label:`Фактический досрочный платёж`,expr:`min(lump, bal)`,note:`Нельзя внести больше остатка долга.`},{key:`bal2`,label:`Остаток долга после досрочного платежа`,expr:`bal - lumpEff`},{key:`newPay`,label:`Новый ежемесячный платёж`,expr:`mode == 1 ? pay + extra : pmt(rate, left, bal2)`,note:`Режим «уменьшить срок»: платёж прежний (плюс доплата). Режим «уменьшить платёж»: пересчитывается на оставшийся срок.`},{key:`monthsNew`,label:`Новый срок до конца кредита, мес.`,expr:`mode == 1 ? payoffMonths(rate, newPay, bal2) : left`},{key:`totalBefore`,label:`Выплаты без досрочного платежа`,expr:`payoffTotal(rate, pay, bal)`,note:`Сумма всех оставшихся платежей, если ничего не менять.`},{key:`totalAfterPayments`,label:`Оставшиеся платежи после досрочного`,expr:`payoffTotal(rate, newPay, bal2)`},{key:`interestBefore`,label:`Проценты к уплате без досрочного платежа`,expr:`totalBefore - bal`},{key:`interestAfter`,label:`Проценты к уплате после досрочного платежа`,expr:`totalAfterPayments - bal2`},{key:`saving`,label:`Экономия на процентах`,expr:`interestBefore - interestAfter`,note:`Разница между процентами, которые вы заплатили бы без досрочного платежа, и после него.`},{key:`savingTerm`,label:`Экономия при сокращении срока (для сравнения)`,expr:`(payoffTotal(rate, pay, bal) - bal) - (payoffTotal(rate, pay, bal2) - bal2)`},{key:`savingPay`,label:`Экономия при снижении платежа (для сравнения)`,expr:`(payoffTotal(rate, pay, bal) - bal) - (payoffTotal(rate, pmt(rate, left, bal2), bal2) - bal2)`},{key:`grandBase`,label:`Все выплаты по кредиту без досрочного платежа`,expr:`payoffTotal(rate, pay, amount)`},{key:`freeBefore`,label:`Свободный бюджет сейчас`,expr:`income - pay - expenses`,note:`Доход минус платёж по кредиту минус обязательные расходы.`},{key:`freeAfter`,label:`Свободный бюджет после досрочного платежа`,expr:`income - newPay - expenses`}],outputs:[{id:`saving`,label:`Экономия на процентах`,expr:`saving`,format:`money`,better:`higher`,primary:!0,hint:`Сколько процентов вы не заплатите банку.`},{id:`payment`,label:`Ежемесячный платёж`,expr:`newPay`,baselineExpr:`pay`,format:`money2`,better:`lower`,primary:!0},{id:`term`,label:`Срок до конца кредита`,expr:`monthsNew`,baselineExpr:`left`,format:`duration`,better:`lower`,primary:!0},{id:`budget`,label:`Свободный бюджет в месяц`,expr:`freeAfter`,baselineExpr:`freeBefore`,format:`money`,better:`higher`,primary:!0,hint:`Что остаётся после платежа по кредиту и обязательных расходов.`},{id:`overpay`,label:`Проценты к уплате (переплата)`,expr:`interestAfter`,baselineExpr:`interestBefore`,format:`money`,better:`lower`},{id:`outflow`,label:`Всего выплатите (с досрочным платежом)`,expr:`lumpEff + totalAfterPayments`,baselineExpr:`totalBefore`,format:`money`,better:`lower`,hint:`Все будущие деньги, которые уйдут на кредит: платежи плюс сам досрочный взнос.`},{id:`balance`,label:`Остаток долга сразу после взноса`,expr:`bal2`,baselineExpr:`bal`,format:`money`,better:`lower`}],hints:[{id:`idle`,level:`info`,lead:!0,when:`lump == 0 && extra == 0`,text:`Укажите сумму досрочного платежа или ежемесячную доплату, чтобы увидеть, как изменятся платёж, срок и переплата.`},{id:`minus`,level:`danger`,lead:!0,when:`freeAfter < 0`,text:`После платежа бюджет уходит в минус на {-freeAfter|money} в месяц. Уменьшите ежемесячную доплату или выберите режим «Уменьшить платёж».`},{id:`full`,level:`warning`,when:`lump >= bal && lump > 0`,text:`Сумма взноса больше остатка долга ({bal|money}) — кредит будет закрыт полностью, лишние {lump - bal|money} не потребуются.`},{id:`term-mode`,level:`success`,lead:!0,when:`mode == 1 && saving > 0 && extra == 0`,text:`Платёж остаётся прежним, а кредит закончится на {left - monthsNew|duration} раньше. Вы сэкономите {saving|money} на процентах.`},{id:`term-extra`,level:`success`,lead:!0,when:`mode == 1 && saving > 0 && extra > 0`,text:`Платёж вырастет до {newPay|money2}, зато кредит закончится на {left - monthsNew|duration} раньше. Вы сэкономите {saving|money} на процентах.`},{id:`pay-mode`,level:`success`,lead:!0,when:`mode == 2 && lump > 0 && saving > 0`,text:`Платёж снизится на {pay - newPay|money2} в месяц, срок не изменится. Свободный бюджет вырастет до {freeAfter|money}, экономия на процентах составит {saving|money}.`},{id:`compare`,level:`info`,when:`lump > 0 && lump < bal`,text:`Тот же взнос: сокращение срока сэкономило бы {savingTerm|money}, уменьшение платежа — {savingPay|money}. Сокращение срока выгоднее на {savingTerm - savingPay|money}, но снижение платежа даёт свободные деньги каждый месяц.`},{id:`early`,level:`info`,when:`lump > 0 && paid > 0 && paid < n / 2`,text:`Чем раньше досрочный платёж, тем больше экономия: в начале срока большая часть платежа — это проценты.`},{id:`late`,level:`info`,when:`lump > 0 && paid >= n / 2`,text:`Прошло больше половины срока — основная часть платежа уже идёт на погашение долга, поэтому эффект от досрочного взноса скромнее, чем в начале.`},{id:`yield`,level:`info`,when:`lump > 0`,text:`Досрочное погашение — это гарантированная доходность, равная ставке по кредиту ({rate|percent} годовых). Сравните её со ставкой по вкладу и оставьте подушку безопасности на 3–6 месяцев расходов.`}],charts:[{id:`balance`,title:`Остаток долга`,horizon:`n`,yFormat:`money`,series:[{id:`base`,label:`Без досрочного платежа`,expr:`balance(rate, pay, amount, t)`,color:`#8a948d`,dashed:!0},{id:`new`,label:`С досрочным платежом`,expr:`t < paid ? balance(rate, pay, amount, t) : balance(rate, newPay, bal2, t - paid)`,color:`#1b7a4a`}]},{id:`cumulative`,title:`Сколько всего выплачено (нарастающим итогом)`,horizon:`n`,yFormat:`money`,series:[{id:`base`,label:`Без досрочного платежа`,expr:`min(pay * t, grandBase)`,color:`#8a948d`,dashed:!0},{id:`new`,label:`С досрочным платежом`,expr:`t < paid ? min(pay * t, grandBase) : pay * paid + lumpEff + min(newPay * (t - paid), totalAfterPayments)`,color:`#1b7a4a`}]}],schedule:{title:`График платежей`,horizon:`paid + monthsNew`,columns:[Ce(`prev`,``,`t <= paid ? balance(rate, pay, amount, t - 1) : balance(rate, newPay, bal2, t - 1 - paid)`,`money2`,{hidden:!0}),Ce(`payment`,`Платёж`,`t <= paid ? pay : (t == paid + monthsNew ? prev * (1 + rate / 1200) : min(newPay, prev * (1 + rate / 1200)))`,`money2`,{total:!0}),Ce(`interest`,`Проценты`,`prev * rate / 1200`,`money2`,{total:!0}),Ce(`principal`,`Основной долг`,`payment - interest`,`money2`,{total:!0}),Ce(`lumpRow`,`Досрочный платёж`,`(t == paid || (paid == 0 && t == 1)) ? lumpEff : 0`,`money2`,{total:!0}),Ce(`rest`,`Остаток долга`,`prev - principal - lumpRow`)]},presets:[{id:`typical`,label:`Типовая ипотека`,values:{amount:45e5,rate:13,term:20,paid:36,lump:5e5,mode:1,extra:0,income:15e4,expenses:55e3}},{id:`rural`,label:`Льготная ставка (пример)`,values:{amount:3e6,rate:3,term:25,paid:24,lump:3e5,mode:1,extra:0}},{id:`big`,label:`Крупный кредит, снизить платёж`,values:{amount:9e6,rate:14,term:25,paid:12,lump:1e6,mode:2,extra:0}},{id:`monthly`,label:`Регулярная доплата`,values:{amount:45e5,rate:13,term:20,paid:12,lump:0,mode:1,extra:1e4}}],tests:[{id:`defaults`,name:`Значения по умолчанию`,inputs:{},expect:[{output:`saving`,value:2705695.48},{output:`payment`,value:52720.91},{output:`term`,value:144},{output:`budget`,value:42279.09},{output:`overpay`,value:3723067.66},{output:`outflow`,value:8049366.77},{output:`balance`,value:3826299.1}]},{id:`preset-2`,name:`Пример «Льготная ставка (пример)»`,inputs:{amount:3e6,rate:3,term:25,paid:24,lump:3e5,mode:1,extra:0},expect:[{output:`saving`,value:268968.06},{output:`payment`,value:14226.34},{output:`term`,value:237},{output:`budget`,value:80773.66},{output:`overpay`,value:823661.07},{output:`outflow`,value:3657501.52},{output:`balance`,value:2533840.45}]}],assumptions:[`Платежи аннуитетные, вносятся раз в месяц; досрочный платёж вносится в дату очередного платежа.`,`Ставка не меняется в течение срока. Страховка, комиссии и штрафы не учитываются.`,`Платёж округляется до копеек, последний платёж корректируется на остаток долга.`,`Расчёт ориентировочный: точный график платежей указан в договоре и в личном кабинете.`],clientDemo:{contract:`Ипотечный кредит № …4821 (демо-данные)`,values:{amount:385e4,rate:11.9,term:20,paid:31,income:14e4,expenses:52e3}},cta:{label:`Узнать условия в банке`,url:`https://www.rshb.ru/natural/mortgage`}},Te={id:`renovation-loan`,title:`Кредит на ремонт`,subtitle:`Потянете ли платёж и стоит ли копить вместо кредита`,description:`Оцените, как кредит на ремонт повлияет на платёж, переплату, долговую нагрузку и свободный бюджет семьи — и сравните его с вариантом «накопить самостоятельно».`,icon:`tools`,category:`Жизнь после ипотеки`,enabled:!0,params:[{key:`income`,label:`Доход семьи в месяц (на руки)`,type:`number`,unit:`money`,default:15e4,min:1e4,max:5e6,step:5e3,group:`Бюджет семьи`},{key:`mortgagePay`,label:`Платёж по ипотеке в месяц`,type:`number`,unit:`money`,default:45e3,min:0,max:1e6,step:1e3,group:`Бюджет семьи`},{key:`otherDebts`,label:`Другие платежи по кредитам в месяц`,type:`number`,unit:`money`,default:8e3,min:0,max:1e6,step:1e3,group:`Бюджет семьи`},{key:`expenses`,label:`Обязательные расходы в месяц`,type:`number`,unit:`money`,default:55e3,min:0,max:3e6,step:1e3,hint:`Еда, ЖКХ, транспорт, связь — без учёта кредитов.`,group:`Бюджет семьи`},{key:`cost`,label:`Стоимость ремонта`,type:`number`,unit:`money`,default:8e5,min:1e4,max:2e7,step:1e4,group:`Ремонт`},{key:`own`,label:`Свои средства на ремонт`,type:`number`,unit:`money`,default:2e5,min:0,maxExpr:`cost`,step:1e4,group:`Ремонт`},{key:`loanRate`,label:`Ставка по кредиту`,type:`number`,unit:`percent`,default:18,min:0,max:60,step:.1,group:`Кредит`},{key:`loanTerm`,label:`Срок кредита`,type:`number`,unit:`years`,default:3,min:.5,max:10,step:.5,group:`Кредит`},{key:`save`,label:`Сколько можете откладывать в месяц`,type:`number`,unit:`money`,default:25e3,min:0,max:1e6,step:1e3,hint:`0 — если копить не получится: сравнение с накоплениями скроется.`,group:`Если копить самим`},{key:`depositRate`,label:`Ставка по вкладу`,type:`number`,unit:`percent`,default:14,min:0,max:40,step:.1,group:`Если копить самим`},{key:`infl`,label:`Рост цен на ремонт в год`,type:`number`,unit:`percent`,default:9,min:0,max:40,step:.5,hint:`Пока копите, материалы и работа дорожают.`,group:`Если копить самим`}],formulas:[{key:`need`,label:`Сумма кредита`,expr:`max(0, cost - own)`,note:`Стоимость ремонта минус свои средства.`},{key:`n`,label:`Срок кредита, мес.`,expr:`loanTerm * 12`},{key:`loanPay`,label:`Платёж по кредиту на ремонт`,expr:`pmt(loanRate, n, need)`},{key:`overpay`,label:`Переплата по кредиту`,expr:`totalInterest(loanRate, n, need)`},{key:`loanMonths`,label:`Платежей по кредиту на ремонт`,expr:`if(need > 0, payoffMonths(loanRate, loanPay, need), 0)`},{key:`debtBefore`,label:`Платежи по долгам сейчас`,expr:`mortgagePay + otherDebts`},{key:`debtAfter`,label:`Платежи по долгам с кредитом на ремонт`,expr:`debtBefore + loanPay`},{key:`pdnBefore`,label:`Долговая нагрузка сейчас, %`,expr:`debtBefore / income * 100`,note:`Долговая нагрузка = все ежемесячные платежи по кредитам ÷ ежемесячный доход.`},{key:`pdnAfter`,label:`Долговая нагрузка с кредитом на ремонт, %`,expr:`debtAfter / income * 100`},{key:`freeBefore`,label:`Свободный бюджет сейчас`,expr:`income - debtBefore - expenses`},{key:`freeAfter`,label:`Свободный бюджет с кредитом на ремонт`,expr:`freeBefore - loanPay`},{key:`interestPct`,label:`Переплата в % от суммы кредита`,expr:`if(need > 0, overpay / need * 100, 0)`},{key:`saveMonths`,label:`Сколько копить, мес.`,expr:`if(need > 0 && save > 0, savingMonths(depositRate, save, need, infl), 0)`,note:`Накопления растут по ставке вклада, но ремонт дорожает вместе с ценами. Поэтому накопления считаются в сегодняшних ценах: ставка вклада уменьшена на рост цен.`},{key:`maxPay50`,label:`Допустимый платёж при нагрузке 50%`,expr:`max(0, income * 0.5 - debtBefore)`},{key:`r`,label:`Месячная ставка кредита`,expr:`loanRate / 1200`},{key:`maxLoan50`,label:`Максимальный кредит при нагрузке 50%`,expr:`if(r > 0, maxPay50 * (1 - pow(1 + r, -n)) / r, maxPay50 * n)`}],outputs:[{id:`loanPay`,label:`Платёж по кредиту на ремонт`,expr:`loanPay`,format:`money2`,better:`neutral`,primary:!0,visibleWhen:`need > 0`},{id:`overpay`,label:`Переплата по кредиту`,expr:`overpay`,format:`money`,better:`lower`,primary:!0,visibleWhen:`need > 0`},{id:`pdn`,label:`Долговая нагрузка`,expr:`pdnAfter`,baselineExpr:`pdnBefore`,format:`percent`,better:`lower`,primary:!0,hint:`Доля дохода, которая уходит на платежи по кредитам.`},{id:`free`,label:`Свободный бюджет в месяц`,expr:`freeAfter`,baselineExpr:`freeBefore`,format:`money`,better:`higher`,primary:!0},{id:`total`,label:`Ремонт с учётом процентов`,expr:`cost + overpay`,baselineExpr:`cost`,format:`money`,better:`lower`},{id:`wait`,label:`Накопить самостоятельно`,expr:`saveMonths`,format:`duration`,better:`neutral`,visibleWhen:`need > 0 && save > 0`,hint:`Через сколько месяцев накопится нужная сумма без кредита.`},{id:`maxLoan`,label:`Макс. кредит при нагрузке до 50%`,expr:`maxLoan50`,format:`money`,better:`neutral`}],hints:[{id:`nocredit`,level:`success`,lead:!0,when:`need <= 0`,text:`Своих средств хватает на весь ремонт — кредит не нужен.`},{id:`minus`,level:`danger`,lead:!0,when:`need > 0 && freeAfter < 0`,text:`Бюджета не хватает: после платежа вы уходите в минус на {-freeAfter|money} в месяц. Уменьшите сумму кредита, увеличьте срок или найдите дополнительные средства.`},{id:`pdn80`,level:`danger`,lead:!0,when:`need > 0 && pdnAfter >= 80`,text:`Нагрузка {pdnAfter|percent} — очень высокая. Банки обычно отказывают, когда платежи съедают более 80% дохода.`},{id:`pdn50`,level:`danger`,lead:!0,when:`need > 0 && pdnAfter >= 50 && pdnAfter < 80`,text:`Нагрузка {pdnAfter|percent} — зона высокого риска. Кредит могут не одобрить, а запас прочности при падении дохода почти нулевой. Уменьшите сумму или увеличьте срок.`},{id:`pdn35`,level:`warning`,lead:!0,when:`need > 0 && pdnAfter >= 35 && pdnAfter < 50 && freeAfter >= 0`,text:`Нагрузка {pdnAfter|percent} — выше комфортных 35%. После платежа останется {freeAfter|money} в месяц: запас небольшой, учтите возможное падение дохода.`},{id:`ok`,level:`success`,lead:!0,when:`need > 0 && pdnAfter < 35 && freeAfter >= 0`,text:`Нагрузка в норме ({pdnAfter|percent}), и после платежа остаётся {freeAfter|money} в месяц.`},{id:`save`,level:`info`,when:`need > 0 && save > 0 && saveMonths <= n`,text:`Накопить самим выйдет за {saveMonths|duration} — без переплаты {overpay|money}. Если ремонт не срочный, это выгоднее; если срочный — кредит оправдан, но ищите ставку ниже и гасите досрочно.`},{id:`long-save`,level:`info`,when:`need > 0 && save > 0 && saveMonths > n`,text:`Копить придётся дольше срока кредита ({saveMonths|duration}). Часть работ можно сделать сейчас на свои средства, остальное — позже.`},{id:`own`,level:`info`,when:`need > 0 && own < cost * 0.3`,text:`Каждые 100 000 ₽ собственных средств при таких условиях экономят около {totalInterest(loanRate, n, 100000)|money} переплаты.`},{id:`rate`,level:`info`,when:`need > 0 && loanRate > 12`,text:`Сравните ставку {loanRate|percent} с другими предложениями: целевой кредит на ремонт или увеличение суммы по ипотеке иногда обходятся дешевле потребительского кредита.`}],charts:[{id:`loan-balance`,title:`Остаток долга по кредиту на ремонт`,horizon:`n`,yFormat:`money`,visibleWhen:`need > 0`,series:[{id:`bal`,label:`Остаток долга`,expr:`balance(loanRate, loanPay, need, t)`,color:`#c2692a`}]},{id:`saving`,title:`Копить или брать кредит`,horizon:`saveMonths`,yFormat:`money`,visibleWhen:`need > 0 && save > 0`,series:[{id:`target`,label:`Нужная сумма`,expr:`need`,color:`#8a948d`,dashed:!0},{id:`saved`,label:`Накоплено (в сегодняшних ценах)`,expr:`savingsAfter(depositRate, save, t, infl)`,color:`#1b7a4a`}]}],schedule:xe({rate:`loanRate`,pay:`loanPay`,pv:`need`,months:`loanMonths`,visibleWhen:`need > 0`}),presets:[{id:`cosmetic`,label:`Косметический ремонт`,values:{income:12e4,mortgagePay:35e3,otherDebts:0,expenses:5e4,cost:3e5,own:1e5,loanRate:18,loanTerm:2,save:15e3,depositRate:14,infl:9}},{id:`capital`,label:`Капитальный ремонт`,values:{income:18e4,mortgagePay:55e3,otherDebts:1e4,expenses:65e3,cost:15e5,own:3e5,loanRate:17,loanTerm:5,save:3e4,depositRate:14,infl:9}},{id:`tight`,label:`Жёсткий бюджет`,values:{income:9e4,mortgagePay:38e3,otherDebts:6e3,expenses:4e4,cost:5e5,own:5e4,loanRate:20,loanTerm:3,save:8e3,depositRate:14,infl:9}}],tests:[{id:`defaults`,name:`Значения по умолчанию`,inputs:{},expect:[{output:`loanPay`,value:21691.44},{output:`overpay`,value:180891.71},{output:`pdn`,value:49.79},{output:`free`,value:20308.56},{output:`total`,value:980891.71},{output:`wait`,value:23},{output:`maxLoan`,value:608535.05}]},{id:`preset-2`,name:`Пример «Капитальный ремонт»`,inputs:{income:18e4,mortgagePay:55e3,otherDebts:1e4,expenses:65e3,cost:15e5,own:3e5,loanRate:17,loanTerm:5,save:3e4,depositRate:14,infl:9},expect:[{output:`loanPay`,value:29823.09},{output:`overpay`,value:589385.49},{output:`pdn`,value:52.68},{output:`free`,value:20176.91},{output:`total`,value:2089385.49},{output:`wait`,value:37},{output:`maxLoan`,value:1005931.95}]}],assumptions:[`Платёж по кредиту на ремонт аннуитетный, ставка не меняется. Страховка и комиссии не учитываются.`,`Долговая нагрузка считается как сумма платежей по всем кредитам ÷ доход. Банки используют схожий показатель, но методика расчёта у каждого банка своя.`,`Накопления: ежемесячные взносы с капитализацией по ставке вклада; рост цен на ремонт учтён через реальную доходность. Налоги на проценты по вкладу не учитываются.`,`Расчёт ориентировочный и не является решением банка об одобрении кредита.`],clientDemo:{contract:`Ипотечный кредит № …4821 (демо-данные)`,values:{income:14e4,mortgagePay:41200,otherDebts:0}},cta:{label:`Узнать условия в банке`,url:`https://www.rshb.ru/natural/loans/loans-renovation`}},T={id:`rent-out`,title:`Сдача квартиры в аренду`,compareLabels:{before:`Без аренды`,after:`С арендой`},subtitle:`Покроет ли аренда платёж по ипотеке`,description:`Посчитайте чистый доход от аренды с учётом налогов, простоя и расходов, и узнайте, какую часть платежа по ипотеке покроет аренда и сколько придётся доплачивать.`,icon:`key`,category:`Жизнь после ипотеки`,enabled:!0,params:[{key:`otherTaxBase`,label:`Другие доходы основной базы за год`,type:`number`,unit:`money`,default:0,min:0,max:1e9,step:1e4,visibleWhen:`taxRegime == 13`,hint:`Зарплата и другие доходы по общей шкале. Нужны, чтобы оценить добавочный НДФЛ с аренды.`,group:`Расходы и налоги`},{key:`price`,label:`Стоимость квартиры`,type:`number`,unit:`money`,default:6e6,min:3e5,max:2e8,step:1e5,group:`Квартира и ипотека`},{key:`mortgagePay`,label:`Платёж по ипотеке в месяц`,type:`number`,unit:`money`,default:55e3,min:0,max:2e6,step:1e3,group:`Квартира и ипотека`},{key:`rent`,label:`Арендная плата в месяц`,type:`number`,unit:`money`,default:4e4,min:0,max:2e6,step:1e3,group:`Аренда`},{key:`vacancy`,label:`Простой квартиры в год`,type:`number`,unit:`months`,default:1,min:0,max:11,step:.5,hint:`Сколько месяцев в году квартира стоит без арендаторов (поиск жильцов, ремонт между ними).`,group:`Аренда`},{key:`taxRegime`,label:`Налогообложение дохода`,type:`select`,unit:`none`,default:13,options:[{value:4,label:`Самозанятый (НПД), жильцы — физлица: 4%`},{value:6,label:`Самозанятый (НПД), жильцы — юрлица/ИП: 6%`},{value:13,label:`НДФЛ по прогрессивной шкале (13% до 2,4 млн ₽ в год)`}],group:`Расходы и налоги`},{key:`utilities`,label:`Постоянные расходы собственника в месяц`,type:`number`,unit:`money`,default:4e3,min:0,max:5e5,step:500,hint:`Взнос на капремонт, налог на имущество (в пересчёте на месяц), страховка, коммунальные платежи, которые не оплачивает арендатор.`,group:`Расходы и налоги`},{key:`reservePct`,label:`Резерв на ремонт и обслуживание`,type:`number`,unit:`percent`,default:8,min:0,max:30,step:1,hint:`Доля арендной платы, которую вы откладываете на мелкий ремонт и замену мебели.`,group:`Расходы и налоги`},{key:`mgmtPct`,label:`Комиссия агента или управляющей компании`,type:`number`,unit:`percent`,default:0,min:0,max:30,step:1,hint:`Доля арендной платы. 0 — если сдаёте самостоятельно.`,group:`Расходы и налоги`}],formulas:[{key:`occupied`,label:`Месяцев с арендатором в году`,expr:`12 - vacancy`},{key:`gross`,label:`Доход от аренды за год (до налогов)`,expr:`rent * occupied`},{key:`tax`,label:`Налог за год`,expr:`taxRegime == 13 ? incomeTax2025(otherTaxBase + gross) - incomeTax2025(otherTaxBase) : gross * taxRegime / 100`,note:`НПД — фиксированная ставка (4 % при арендаторе-физлице, 6 % при юрлице или агентстве), лимит дохода 2,4 млн ₽ в год, подходит для сдачи жилья. НДФЛ — прогрессивная шкала (закон 176-ФЗ): 13 % до 2,4 млн ₽ дохода в год, 15 % до 5 млн, 18 % до 20 млн, 20 % до 50 млн, 22 % выше; повышенная ставка применяется только к части дохода сверх порога.`},{key:`mgmt`,label:`Комиссия за год`,expr:`gross * mgmtPct / 100`},{key:`reserve`,label:`Резерв на ремонт за год`,expr:`gross * reservePct / 100`},{key:`fixed`,label:`Постоянные расходы за год`,expr:`utilities * 12`},{key:`netYear`,label:`Чистый доход за год`,expr:`gross - tax - mgmt - reserve - fixed`,note:`Доход от аренды минус налог, комиссия, резерв и постоянные расходы.`},{key:`netMonth`,label:`Чистый доход в месяц`,expr:`netYear / 12`},{key:`topUp`,label:`Доплата из своих средств в месяц`,expr:`max(0, mortgagePay - netMonth)`},{key:`surplus`,label:`Остаток после платежа по ипотеке в месяц`,expr:`max(0, netMonth - mortgagePay)`},{key:`coverage`,label:`Какую часть платежа покрывает аренда, %`,expr:`if(mortgagePay > 0, max(0, netMonth) / mortgagePay * 100, 0)`},{key:`yieldPct`,label:`Чистая доходность в год, %`,expr:`netYear / price * 100`,note:`Чистый доход за год ÷ стоимость квартиры.`},{key:`minRent`,label:`Аренда для самоокупаемости`,expr:`rentForCoverage(mortgagePay * 12 + fixed, occupied, mgmtPct + reservePct, taxRegime, otherTaxBase)`,note:`Минимальная аренда, при которой чистый доход равен платежу по ипотеке. Учитывает другую основную базу и переходы порогов НДФЛ. Для НПД отдельно проверьте лимит дохода.`},{key:`npdSaving`,label:`Выгода от режима НПД 4% за год`,expr:`max(0, tax - gross * 0.04)`},{key:`vacancyCost`,label:`Стоимость месяца простоя (чистыми)`,expr:`rent * (1 - (mgmtPct + reservePct) / 100) - (taxRegime == 13 ? incomeTax2025(otherTaxBase + gross) - incomeTax2025(otherTaxBase + max(0, gross - rent)) : rent * taxRegime / 100)`}],outputs:[{id:`topUp`,label:`Ваша доплата по ипотеке в месяц`,expr:`topUp`,baselineExpr:`mortgagePay + utilities`,format:`money`,better:`lower`,primary:!0,hint:`Сколько вы платите из своего кармана. Без аренды это весь платёж плюс постоянные расходы на квартиру.`},{id:`net`,label:`Чистый доход от аренды в месяц`,expr:`netMonth`,format:`money`,better:`higher`,primary:!0},{id:`coverage`,label:`Аренда покрывает платёж на`,expr:`coverage`,format:`percent`,better:`higher`,primary:!0,visibleWhen:`mortgagePay > 0`},{id:`surplus`,label:`Остаётся в плюсе в месяц`,expr:`surplus`,format:`money`,better:`higher`,visibleWhen:`surplus > 0`},{id:`yield`,label:`Чистая доходность в год`,expr:`yieldPct`,format:`percent`,better:`higher`,hint:`Чистый доход за год к стоимости квартиры.`},{id:`netYear`,label:`Чистый доход за год`,expr:`netYear`,format:`money`,better:`higher`},{id:`tax`,label:`Налог за год`,expr:`tax`,format:`money`,better:`lower`},{id:`minRent`,label:`Аренда для самоокупаемости`,expr:`minRent`,format:`money`,better:`neutral`,hint:`Минимальная арендная плата, при которой платёж по ипотеке покрывается полностью.`}],hints:[{id:`npd-coverage-limit`,level:`warning`,when:`taxRegime != 13 && minRent * occupied > 2400000`,text:`Для самоокупаемости годовой доход превысит лимит НПД 2,4 млн ₽. В выбранном режиме такая самоокупаемость недоступна: сравните с НДФЛ.`},{id:`nomortgage`,level:`success`,lead:!0,when:`mortgagePay <= 0 && netMonth > 0`,text:`Ипотеки нет: аренда приносит {netMonth|money} в месяц чистыми, доходность {yieldPct|percent} в год.`},{id:`cover`,level:`success`,lead:!0,when:`mortgagePay > 0 && netMonth >= mortgagePay`,text:`Аренда полностью покрывает платёж по ипотеке, в плюсе остаётся {surplus|money} в месяц.`},{id:`partial`,level:`warning`,lead:!0,when:`netMonth > 0 && netMonth < mortgagePay`,text:`Аренда покрывает {coverage|percent} платежа; ежемесячно придётся добавлять {topUp|money}. Для самоокупаемости нужна аренда около {minRent|money}.`},{id:`loss`,level:`danger`,lead:!0,when:`netMonth <= 0`,text:`Расходы и налоги не меньше арендного дохода — при таких условиях сдача квартиры убыточна.`},{id:`tax-total`,level:`info`,when:`taxRegime == 13 && gross > 0`,text:`Ставки НДФЛ считаются от всего вашего годового дохода, а не только от аренды. Если у вас есть зарплата, налог с аренды может быть выше расчётного. ИП вместо НДФЛ может применять УСН или патент: это отдельный выбор, его нужно уточнить в налоговой.`},{id:`npd`,level:`info`,when:`taxRegime == 13 && gross > 0 && gross <= 2400000`,text:`Режим самозанятого (НПД) с налогом 4% сэкономил бы {npdSaving|money} в год. Условия: годовой доход до 2,4 млн ₽ и регистрация в ФНС — проверьте актуальные правила на сайте налоговой.`},{id:`npd-limit`,level:`warning`,when:`taxRegime < 13 && gross > 2400000`,text:`Годовой доход {gross|money} выше лимита НПД (2,4 млн ₽): при превышении придётся перейти на НДФЛ.`},{id:`vacancy`,level:`info`,when:`vacancy >= 3`,text:`Простой {vacancy|number} мес. в год заметно снижает доходность: каждый месяц без жильцов стоит вам около {vacancyCost|money} чистыми.`},{id:`bank`,level:`info`,text:`Ипотечная квартира находится в залоге у банка. Проверьте условия договора: сдача в аренду может требовать уведомления или согласия банка, а условия страхования — отдельного учёта.`}],charts:[{id:`cash`,title:`Ваши расходы на ипотеку нарастающим итогом (5 лет)`,horizon:`60`,yFormat:`money`,series:[{id:`without`,label:`Без аренды`,expr:`(mortgagePay + utilities) * t`,color:`#8a948d`,dashed:!0},{id:`with`,label:`С арендой`,expr:`(mortgagePay - netMonth) * t`,color:`#1b7a4a`}]}],presets:[{id:`city`,label:`Однокомнатная в городе`,values:{price:6e6,mortgagePay:55e3,rent:4e4,vacancy:1,taxRegime:13,utilities:4e3,reservePct:8,mgmtPct:0}},{id:`region`,label:`Квартира в регионе`,values:{price:3e6,mortgagePay:28e3,rent:22e3,vacancy:1.5,taxRegime:4,utilities:2500,reservePct:8,mgmtPct:0}} y`,default:15e4,min:1e4,max:5e6,step:5e3,group:`Бюджет семьи`},{key:`expenses`,label:`Обязательные расходы в месяц`,type:`number`,unit:`money`,default:55e3,min:0,max:3e6,step:1e3,group:`Бюджет семьи`},{key:`otherDebts`,label:`Другие платежи по кредитам в месяц`,type:`number`,unit:`money`,default:5e3,min:0,max:1e6,step:1e3,group:`Бюджет семьи`},{key:`fund`,label:`Подушка безопасности`,type:`number`,unit:`money`,default:3e5,min:0,max:5e7,step:1e4,hint:`Свободные деньги, которые можно потратить на жизнь и платежи.`,group:`Бюджет семьи`},{key:`incomeDrop`,label:`Падение дохода`,type:`number`,unit:`percent`,default:20,min:0,max:100,step:1,group:`Стресс-сценарий`},{key:`rateRise`,label:`Рост ставки`,type:`number`,unit:`percent`,default:3,min:0,max:20,step:.5,hint:`В процентных пунктах. Актуально для плавающей ставки и при рефинансировании.`,group:`Стресс-сценарий`}],formulas:[{key:`n`,label:`Срок, мес.`,expr:`years * 12`},{key:`pay`,label:`Платёж сейчас`,expr:`actualPay > 0 ? actualPay : pmt(rate, n, debt)`},{key:`payStress`,label:`Платёж при выросшей ставке`,expr:`rateRise == 0 ? pay : pmt(rate + rateRise, n, debt)`},{key:`incomeStress`,label:`Доход после падения`,expr:`income * (1 - incomeDrop / 100)`},{key:`freeNow`,label:`Свободный бюджет сейчас`,expr:`income - pay - otherDebts - expenses`},{key:`freeStress`,label:`Свободный бюджет в стресс-сценарии`,expr:`incomeStress - payStress - otherDebts - expenses`},{key:`pdnNow`,label:`Долговая нагрузка сейчас, %`,expr:`(pay + otherDebts) / income * 100`},{key:`pdnStress`,label:`Долговая нагрузка в стресс-сценарии, %`,expr:`if(incomeStress > 0, (payStress + otherDebts) / incomeStress * 100, 100)`},{key:`monthsFund`,label:`На сколько месяцев хватит подушки`,expr:`if(freeStress < 0, floor(fund / -freeStress), 0)`},{key:`dropMax`,label:`Допустимое падение дохода, %`,expr:`max(0, freeNow / income * 100)`,note:`При каком падении дохода свободный бюджет обнулится (при текущей ставке).`}],outputs:[{id:`free`,label:`Свободный бюджет в месяц`,expr:`freeStress`,baselineExpr:`freeNow`,format:`money`,better:`higher`,primary:!0},{id:`payment`,label:`Платёж по ипотеке`,expr:`payStress`,baselineExpr:`pay`,format:`money2`,better:`lower`,primary:!0},{id:`pdn`,label:`Долговая нагрузка`,expr:`pdnStress`,baselineExpr:`pdnNow`,format:`percent`,better:`lower`,primary:!0},{id:`cushion`,label:`Подушки хватит на`,expr:`monthsFund`,format:`duration`,better:`higher`,visibleWhen:`freeStress < 0`,hint:`Сколько месяцев можно покрывать нехватку из подушки безопасности.`},{id:`dropMax`,label:`Запас по доходу`,expr:`dropMax`,format:`percent`,better:`higher`,hint:`На сколько процентов может упасть доход, прежде чем свободный бюджет закончится.`}],hints:[{id:`minus`,level:`danger`,lead:!0,when:`freeStress < 0`,text:`При падении дохода на {incomeDrop|percent} и росте ставки на {rateRise|number} п.п. бюджета не хватает {-freeStress|money} в месяц. Подушки безопасности хватит на {monthsFund|duration}.`},{id:`ok`,level:`success`,lead:!0,when:`freeStress >= 0`,text:`Бюджет выдерживает падение дохода на {incomeDrop|percent} и рост ставки на {rateRise|number} п.п.: останется {freeStress|money} в месяц.`},{id:`reserve`,level:`info`,when:`freeNow >= 0`,text:`Запас прочности: доход может упасть на {dropMax|percent}, прежде чем свободные деньги закончатся.`},{id:`pdn`,level:`warning`,when:`pdnStress >= 50`,text:`В стресс-сценарии на платежи уходит {pdnStress|percent} дохода. Это высокая нагрузка: в такой ситуации сложнее рефинансировать кредит или взять новый.`},{id:`fixed`,level:`info`,text:`Если у вас фиксированная ставка, рост ставки на текущий кредит не повлияет до конца срока. Уточните условия в договоре; рост ставки важен при рефинансировании и для кредитов с плавающей ставкой.`}],charts:[{id:`fund`,title:`Как расходуется подушка безопасности`,horizon:`min(60, monthsFund + 4)`,yFormat:`money`,visibleWhen:`freeStress < 0`,series:[{id:`fund`,label:`Остаток подушки`,expr:`max(0, fund + freeStress * t)`,color:`#c2692a`}]}],presets:[{id:`typical`,label:`Типовой случай`,values:{debt:35e5,rate:12,years:18,income:15e4,expenses:55e3,otherDebts:5e3,fund:3e5,incomeDrop:20,rateRise:3}},{id:`tight`,label:`Жёсткий бюджет`,values:{debt:45e5,rate:13,years:20,income:1e5,expenses:5e4,otherDebts:8e3,fund:12e4,incomeDrop:20,rateRise:3}},{id:`safe`,label:`Большой запас`,values:{debt:2e6,rate:11,years:12,income:2e5,expenses:6e4,otherDebts:0,fund:9e5,incomeDrop:30,rateRise:4}}],clientDemo:{contract:`Ипотечный кредит № …4821 (демо-данные)`,values:{debt:315e4,rate:12.4,years:17,income:14e4}},tests:[{id:`defaults`,name:`Значения по умолчанию`,inputs:{},expect:[{output:`free`,value:13040.82},{output:`payment`,value:46959.18},{output:`pdn`,value:43.3},{output:`dropMax`,value:33.59}]},{id:`preset-2`,name:`Пример «Жёсткий бюджет»`,inputs:{debt:45e5,rate:13,years:20,income:1e5,expenses:5e4,otherDebts:8e3,fund:12e4,incomeDrop:20,rateRise:3},expect:[{output:`free`,value:-40606.52},{output:`payment`,value:62606.52},{output:`pdn`,value:88.26},{output:`cushion`,value:2},{output:`dropMax`,value:0}]}],assumptions:[`Рост ставки применяется ко всему остатку долга при том же сроке: так выглядит платёж при плавающей ставке или рефинансировании.`,`Расходы и другие платежи не меняются; падение дохода применяется ко всему доходу семьи.`,`Подушка расходуется равномерно: каждый месяц на сумму нехватки бюджета.`,`Расчёт ориентировочный и не является прогнозом или рекомендацией банка.`],cta:{label:`Узнать условия в банке`,url:`https://www.rshb.ru/natural/mortgage-refinance`}},Ae={id:`buy-vs-rent`,title:`Купить или снимать`,subtitle:`Что выгоднее через несколько лет`,description:`Сравните два пути с одинаковым ежемесячным бюджетом: купить жильё в ипотеку или снимать и вкладывать разницу вместе со взносом. Результат показывает, сколько капитала будет в каждом случае.`,icon:`scale`,category:`Покупка и строительство`,enabled:!0,compareLabels:{before:`Снимать и копить`,after:`Купить в ипотеку`},params:[{key:`price`,label:`Стоимость жилья`,type:`number`,unit:`money`,default:6e6,min:3e5,max:1e8,step:1e5,group:`Покупка`},{key:`down`,label:`Первоначальный взнос`,type:`number`,unit:`money`,default:12e5,min:0,maxExpr:`price`,step:5e4,group:`Покупка`},{key:`rate`,label:`Ставка по ипотеке`,type:`number`,unit:`percent`,default:12.5,min:0,max:40,step:.1,group:`Покупка`},{key:`term`,label:`Срок ипотеки`,type:`number`,unit:`years`,default:20,min:1,max:30,step:1,group:`Покупка`},{key:`buyCostsPct`,label:`Разовые расходы на покупку (% от цены)`,type:`number`,unit:`percent`,default:1.5,min:0,max:10,step:.1,hint:`Оценка, страховка, регистрация, услуги по сделке.`,group:`Покупка`},{key:`maintPct`,label:`Расходы владельца в год (% от цены)`,type:`number`,unit:`percent`,default:1,min:0,max:10,step:.1,hint:`Налог на имущество, капитальный ремонт, мелкий ремонт.`,group:`Покупка`},{key:`rent`,label:`Аренда такого жилья в месяц`,type:`number`,unit:`money`,default:35e3,min:0,max:1e6,step:1e3,group:`Аренда`},{key:`rentGrowth`,label:`Рост аренды в год`,type:`number`,unit:`percent`,default:7,min:0,max:30,step:.5,group:`Аренда`},{key:`priceGrowth`,label:`Рост цены жилья в год (допущение)`,type:`number`,unit:`percent`,default:6,min:-10,max:30,step:.5,hint:`Главная неопределённость: попробуйте разные значения.`,group:`Допущения`},{key:`invRate`,label:`Доходность накоплений арендатора в год (допущение)`,type:`number`,unit:`percent`,default:9,min:0,max:40,step:.5,hint:`Например, ставка по вкладу. Налоги на доход не учтены.`,group:`Допущения`},{key:`horizon`,label:`Через сколько лет сравниваем`,type:`number`,unit:`years`,default:10,min:1,maxExpr:`term`,step:1,group:`Допущения`},{key:`income`,label:`Доход семьи в месяц (на руки)`,type:`number`,unit:`money`,default:15e4,min:1e4,max:5e6,step:5e3,group:`Бюджет семьи`},{key:`expenses`,label:`Обязательные расходы в месяц`,type:`number`,unit:`money`,default:5e4,min:0,max:3e6,step:1e3,hint:`Еда, коммунальные услуги, транспорт, связь. Аренда и платёж по ипотеке сюда не входят.`,group:`Бюджет семьи`}],formulas:[{key:`n`,label:`Срок ипотеки, мес.`,expr:`term * 12`},{key:`m`,label:`Горизонт сравнения, мес.`,expr:`horizon * 12`},{key:`loan`,label:`Сумма кредита`,expr:`max(0, price - down)`},{key:`fees`,label:`Разовые расходы на покупку`,expr:`price * buyCostsPct / 100`},{key:`pay`,label:`Платёж по ипотеке`,expr:`pmt(rate, n, loan)`},{key:`maint`,label:`Расходы владельца в месяц`,expr:`price * maintPct / 1200`},{key:`costBuy`,label:`Ежемесячные расходы владельца`,expr:`pay + maint`,note:`Платёж по ипотеке плюс расходы владельца. Условие сравнения: оба варианта тратят на жильё одинаковую сумму, а тот, кто платит меньше, вкладывает разницу.`},{key:`u`,label:`Месячный рост накоплений`,expr:`1 + invRate / 1200`},{key:`q`,label:`Месячный рост аренды`,expr:`pow(1 + rentGrowth / 100, 1 / 12)`},{key:`homeValue`,label:`Цена жилья в конце срока`,expr:`price * pow(1 + priceGrowth / 100, m / 12)`},{key:`equity`,label:`Капитал владельца в конце срока`,expr:`homeValue - balance(rate, pay, loan, m)`,note:`Цена жилья минус остаток долга. Расходы на продажу не учитываются.`},{key:`sumU`,label:`Сумма накоплений при взносе 1 ₽ в месяц`,expr:`abs(u - 1) < 0.000000001 ? m : (pow(u, m) - 1) / (u - 1)`},{key:`sumRent`,label:`Накопленная аренда с ростом`,expr:`abs(u - q) < 0.000000001 ? m * pow(u, m - 1) : (pow(u, m) - pow(q, m)) / (u - q)`},{key:`portfolio`,label:`Капитал арендатора в конце срока`,expr:`(down + fees) * pow(u, m) + costBuy * sumU - rent * sumRent`,note:`Арендатор вкладывает взнос с расходами на покупку, а затем ежемесячно разницу между расходами владельца и арендой. Если аренда дороже, разница вычитается.`},{key:`diff`,label:`Выгода покупки в конце срока`,expr:`equity - portfolio`},{key:`freeBuy`,label:`Свободный бюджет владельца`,expr:`income - costBuy - expenses`},{key:`freeRent`,label:`Свободный бюджет арендатора`,expr:`income - rent - expenses`},{key:`pdn`,label:`Доля платежа по ипотеке в доходе, %`,expr:`income > 0 ? pay / income * 100 : 0`}],outputs:[{id:`wea
