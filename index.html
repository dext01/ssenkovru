<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ssenkov.ru</title>
<meta name="description" content="Скоро здесь что-то будет.">
<meta name="theme-color" content="#0b1114">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 800px at 50% 40%, #11222a 0%, #0b1114 60%, #070b0d 100%);
    color: #e9f3f1;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  main {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: grid;
    place-content: center;
    gap: 14px;
    padding: 24px;
    text-align: center;
    pointer-events: none;
  }
  h1 {
    margin: 0;
    font-size: clamp(2.4rem, 8vw, 5rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    background: linear-gradient(100deg, #7ff0d0, #8fb8ff 50%, #c4a2ff);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shift 8s ease-in-out infinite alternate;
  }
  p { margin: 0; font-size: clamp(1rem, 2.6vw, 1.35rem); color: #a9bbb8; }
  .dots span { animation: blink 1.4s infinite both; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes shift { to { background-position: 100% 0; } }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    h1, .dots span { animation: none; }
    .dots span { opacity: 1; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <h1>ssenkov.ru</h1>
  <p>Скоро здесь что-то будет<span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></p>
</main>
<script>
(function () {
  var canvas = document.getElementById('bg');
  var ctx = canvas.getContext('2d');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dpr = 1, w = 0, h = 0, cols = 0, rows = 0, gap = 30;
  var pointer = { x: -9999, y: -9999, active: false };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gap = w < 600 ? 24 : 30;
    cols = Math.ceil(w / gap) + 1;
    rows = Math.ceil(h / gap) + 1;
    if (reduce) draw(0);
  }

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    var ox = (w - (cols - 1) * gap) / 2;
    var oy = (h - (rows - 1) * gap) / 2;
    for (var i = 0; i < cols; i++) {
      for (var j = 0; j < rows; j++) {
        var x = ox + i * gap, y = oy + j * gap;
        // две бегущие волны задают яркость, размер и оттенок точки
        var a = Math.sin(t * 0.0011 + i * 0.35 + j * 0.22);
        var b = Math.sin(t * 0.0007 - i * 0.16 + j * 0.31 + 1.7);
        var k = 0.5 + 0.25 * a + 0.25 * b;
        var dx = x - pointer.x, dy = y - pointer.y;
        var near = pointer.active ? Math.max(0, 1 - Math.sqrt(dx * dx + dy * dy) / 140) : 0;
        var r = 1.1 + 1.7 * k + 2.6 * near;
        var hue = 165 + 85 * (0.5 + 0.5 * Math.sin(t * 0.0004 + i * 0.08 + j * 0.05));
        ctx.fillStyle = 'hsla(' + hue.toFixed(0) + ',85%,' + (58 + 20 * k + 15 * near).toFixed(0) + '%,' + (0.18 + 0.7 * k + 0.3 * near).toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 6.2832);
        ctx.fill();
      }
    }
  }

  function loop(t) {
    draw(t);
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('pointermove', function (e) { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; });
  window.addEventListener('pointerleave', function () { pointer.active = false; });
  resize();
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
