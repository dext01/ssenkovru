<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ssenkov.ru</title>
  <meta name="description" content="ssenkov.ru — скоро здесь что-то будет">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚧</text></svg>">
  <style>
    :root {
      --bg: #f6f5f1;
      --fg: #1c1b19;
      --muted: #77736b;
      --accent: #d9480f;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --fg: #ecebe7; --muted: #8f8b83; --accent: #ff7a45; }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    main { max-width: 36rem; }
    h1 {
      font-size: clamp(2.5rem, 10vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    h1 span { color: var(--accent); }
    p {
      margin-top: 1rem;
      font-size: 1.125rem;
      color: var(--muted);
    }
    .cursor {
      display: inline-block;
      width: 0.6ch;
      background: var(--accent);
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1>ssenkov<span>.ru</span></h1>
    <p>Скоро здесь что-то будет<span class="cursor">&nbsp;</span></p>
  </main>
</body>
</html>
